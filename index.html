<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Редактор открыток</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Caveat&family=Pacifico&family=Playfair+Display&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-dark navbar-brand-bar">
    <div class="container-fluid px-3 px-lg-4">
      <a class="navbar-brand fw-bold mb-0" href="main_screen.html">FreePages</a>
      <a class="nav-link text-white me-auto" href="about.html">О проекте</a>
      <div class="d-flex gap-2">
        <button type="button" class="btn btn-light btn-sm" id="btn-print">Печать</button>
        <button type="button" class="btn btn-light btn-sm" id="btn-share">Поделиться</button>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">
      <aside class="col-lg-3 bg-white border-end py-3 app-sidebar">
        <nav class="nav nav-pills flex-column flex-sm-row flex-lg-column gap-1 mb-3" aria-label="Разделы">
          <a class="nav-link" href="index.html">✏️ Редактор</a>
          <a class="nav-link" href="generator.html">🎲 Генератор</a>
          <a class="nav-link" href="gallery.html">🖼 Мои работы</a>
        </nav>
        <div>
          <h3 class="h6 text-uppercase text-secondary">Шаблон</h3>
          <div class="d-flex flex-wrap gap-2 mb-3" id="templates"></div>
          <h3 class="h6 text-uppercase text-secondary">Картинка</h3>
          <div class="d-flex flex-wrap gap-2 mb-3" id="images"></div>
          <h3 class="h6 text-uppercase text-secondary">Шрифт</h3>
          <div class="d-flex flex-wrap gap-2 mb-3" id="fonts"></div>
          <h3 class="h6 text-uppercase text-secondary">Текст</h3>
          <textarea class="form-control" id="text-input" rows="3"></textarea>
        </div>
      </aside>
      <main class="col-lg-9 py-4 d-flex flex-column align-items-center gap-3">
        <div class="postcard" id="card">
          <div class="postcard-emoji"></div>
          <p class="postcard-text"></p>
        </div>
        <p class="hint text-secondary small mb-0">Перетащи текст в нужное место</p>
        <div class="postcard-actions d-flex gap-2 flex-wrap justify-content-center">
          <button type="button" class="btn btn-primary" id="btn-save">Сохранить</button>
        </div>
        <div class="status text-success fw-medium" id="status"></div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/card.js"></script>
  <script src="js/main.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
